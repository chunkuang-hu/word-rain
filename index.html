<style>
/* Layout: one-screen phone game with two screens. Level select (100 levels in groups of 10) and the game (HUD, falling-word sky, 3x3 answer grid). */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --ink: #0f1a2b;
  --muted: #5a687c;
  --line: #d2d9e4;
  --accent: #1d4ed8;
  --on-accent: #ffffff;
  --good: #17794b;
  --on-good: #ffffff;
  --bad: #c4352b;
  --on-bad: #ffffff;
  --danger-soft: rgba(196, 53, 43, 0.14);
  --scrim: rgba(237, 240, 245, 0.95);
  --shadow: rgba(15, 26, 43, 0.14);
  --font-display: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif;
  --font-body: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121b; --surface: #162133; --ink: #e9eef6; --muted: #94a2b6; --line: #26344a;
    --accent: #8aaeff; --on-accent: #0c1a3d; --good: #3dbe82; --on-good: #04150c;
    --bad: #ff7366; --on-bad: #2a0704; --danger-soft: rgba(255, 115, 102, 0.16);
    --scrim: rgba(12, 18, 27, 0.95); --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121b; --surface: #162133; --ink: #e9eef6; --muted: #94a2b6; --line: #26344a;
  --accent: #8aaeff; --on-accent: #0c1a3d; --good: #3dbe82; --on-good: #04150c;
  --bad: #ff7366; --on-bad: #2a0704; --danger-soft: rgba(255, 115, 102, 0.16);
  --scrim: rgba(12, 18, 27, 0.95); --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }

button { font-family: inherit; touch-action: manipulation; }

/* ---------- Level select ---------- */
.sel-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sel-top h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; }
.sel-count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sel-count b { color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.go {
  appearance: none; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: 18px;
  padding: 14px 18px; border-radius: 12px;
}
.go:focus-visible, .ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.go:active, .ghost:active { transform: scale(.98); }
.ghost {
  appearance: none; cursor: pointer;
  background: transparent; color: var(--ink);
  border: 1px solid var(--line);
  font-weight: 700; font-size: 16px;
  padding: 12px 16px; border-radius: 12px;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--surface); }
.sw.pass { background: var(--good); border-color: var(--good); }
.sw.last { border: 2px solid var(--accent); }
.how { font-size: 14px; color: var(--muted); }
.how summary { cursor: pointer; padding: 4px 0; font-weight: 700; color: var(--ink); }
.how ul { margin: 6px 0 4px; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; line-height: 1.5; }
.levels {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px;
  padding: 4px 2px 14px;
  margin-inline: -2px;
  -webkit-overflow-scrolling: touch;
}
.grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.grp-h b { font-size: 15px; }
.grp-h span { font-size: 12px; color: var(--muted); }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv {
  position: relative;
  appearance: none; cursor: pointer;
  aspect-ratio: 1;
  min-height: 44px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 12px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  transition: transform .08s;
}
.lv:active { transform: scale(.95); }
.lv:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { .lv:hover { border-color: var(--accent); } }
.lv.pass { background: var(--good); border-color: var(--good); color: var(--on-good); }
.lv.pass::after { content: "✓"; position: absolute; top: 3px; right: 6px; font-family: var(--font-body); font-size: 12px; font-weight: 700; }
.lv.last { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Game ---------- */
.topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back {
  appearance: none; cursor: pointer;
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px; font-size: 14px; font-weight: 700;
}
.back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lvname { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.3; }
.lvname b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--ink); }
.hud { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 8px 14px; }
.score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 46px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: color .2s;
}
.score small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.score.low { color: var(--bad); }
.meta { display: flex; justify-content: flex-end; gap: 14px; color: var(--muted); font-size: 13px; padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.hud .bar { grid-column: 1 / -1; }

.sky {
  position: relative;
  flex: 1;
  min-height: 150px;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.sky::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 31px, var(--line) 31px 32px);
  opacity: .45;
}
.sky::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
  background: linear-gradient(to top, var(--danger-soft), transparent);
}
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--bad); z-index: 1; }
.word {
  position: absolute; top: 0; left: 50%;
  transform: translate(-50%, 0);
  z-index: 2;
  width: calc(100% - 16px);
  padding: 8px 18px 10px;
  border-radius: 14px;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 10vw, 48px);
  line-height: 1.15;
  letter-spacing: .01em;
  overflow-wrap: anywhere;
  text-align: center;
  box-shadow: 0 6px 16px var(--shadow);
  will-change: transform;
}
.word.urgent { border-color: var(--bad); color: var(--bad); }
.word.hit { background: var(--good); border-color: var(--good); color: var(--on-good); }
.word.miss { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.pop {
  position: absolute; z-index: 3;
  transform: translate(-50%, 0);
  font-family: var(--font-display); font-weight: 800; font-size: 34px;
  pointer-events: none;
  animation: pop .9s ease-out forwards;
}
.pop.good { color: var(--good); }
.pop.bad { color: var(--bad); }
@keyframes pop {
  from { opacity: 1; transform: translate(-50%, 0); }
  to { opacity: 0; transform: translate(-50%, -56px); }
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: clamp(56px, 9.5vh, 78px);
  gap: 8px;
}
.cell {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 12px;
  padding: 6px;
  font-weight: 700;
  font-size: clamp(15px, 4.3vw, 18px);
  line-height: 1.25;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .08s;
}
.cell:active { transform: scale(.97); }
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { .cell:hover { border-color: var(--accent); } }
.cell.good { background: var(--good); border-color: var(--good); color: var(--on-good); }
.cell.bad { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.cell.fresh { animation: fresh .8s ease-out; }
@keyframes fresh {
  from { box-shadow: 0 0 0 4px var(--accent); }
  to { box-shadow: 0 0 0 0 transparent; }
}

/* ---------- Overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { margin: 0; font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.panel h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 13vw, 56px); line-height: 1.05; text-wrap: balance; }
.big { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.stats { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 38em; }
.missed h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .08em; color: var(--muted); }
.missed ul { list-style: none; margin: 0; padding: 0; max-height: 28vh; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; -webkit-user-select: text; user-select: text; }
.missed li { display: flex; flex-direction: column; min-width: 0; }
.missed b { font-family: var(--font-display); font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.missed span { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  .pop { animation-duration: .01s; }
  .cell.fresh { animation: none; }
  .bar i { transition: none; }
}
[hidden]{display:none!important}
</style>

</head>
<body>
<div class="app">
  <!-- Level select -->
  <div class="screen" id="selectScreen">
    <div class="sel-top">
      <h1>單字雨</h1>
      <div class="sel-count">已過關 <b id="passedCount">0</b> / 100</div>
    </div>
    <p class="sub">100 關，每關 100 字，依常見程度由易到難。</p>
    <div class="bar" role="progressbar" aria-label="過關進度" aria-valuemin="0" aria-valuemax="100" id="selBar"><i id="selFill"></i></div>
    <button class="go" id="continueBtn" type="button">開始</button>
    <div class="legend"><span><i class="sw pass"></i>已過關</span><span><i class="sw"></i>未過關</span><span><i class="sw last"></i>上次玩的關卡</span></div>
    <details class="how">
      <summary>玩法</summary>
      <ul>
        <li>英文單字會在 10 秒內從上方掉到底，趕快點下方正確的中文意思。</li>
        <li>答對 +1 分，答錯或超時 −1 分。累積 100 分過關。</li>
        <li>分數低於 0 就失敗，剛好 0 分還可以繼續玩。</li>
        <li>答錯的字稍後會再出現。</li>
      </ul>
    </details>
    <div class="levels" id="levels" aria-label="關卡"></div>
  </div>

  <!-- Game -->
  <div class="screen" id="gameScreen" hidden>
    <div class="topline">
      <button class="back" id="back" type="button">← 選關</button>
      <div class="lvname" id="lvname"></div>
    </div>
    <header class="hud">
      <div class="score" id="scoreWrap"><span id="score">0</span><small>/ 100</small></div>
      <div class="meta"><span id="answered">已答 0 題</span><span id="acc">答對率 —</span></div>
      <div class="bar" role="progressbar" aria-label="分數進度" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barfill"></i></div>
    </header>
    <main class="sky" id="sky" aria-label="掉落的英文單字">
      <div class="word" id="word" hidden></div>
      <div class="floor"></div>
    </main>
    <section class="grid" id="grid" aria-label="中文意思選項"></section>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" hidden>
  <div class="panel">
    <p class="eyebrow" id="ov-eyebrow"></p>
    <h1 id="ov-title"></h1>
    <p class="big" id="ov-big" hidden></p>
    <p class="stats" id="ov-stats" hidden></p>
    <div class="missed" id="ov-missed" hidden>
      <h2>答錯的單字</h2>
      <ul id="ov-list"></ul>
    </div>
    <div class="actions" id="ov-actions"></div>
  </div>
</div>

["shiitake", "香菇"],
["buckram", "硬麻布"],
["alienation", "疏離"],

["yore", "昔日"],
["epithet", "綽號"],
["stroboscope", "頻閃儀"],
["tumbledown", "破舊的"],

["incarnate", "具體化的"],
["accompaniment", "伴奏"],
["oriflamme", "旗幟"],

["virtuosity", "精湛技藝"],
["neuralgia", "神經痛"],

["abdication", "退位"],
["parchment", "羊皮紙"],
["polygraph", "測謊儀"],

["citrine", "黃水晶"],

["untenable", "站不住腳的"],
["abiding", "持久的"],
["amaranth", "莧菜"],

["sideburn", "鬢角"],

["deforest", "砍伐森林"],

["marquetry", "鑲嵌工藝"],

["suffocate", "窒息"],
["proofread", "校對"],
["seascape", "海景"]
], loadFailed = false;

  /* ---------- elements ---------- */
  var selectScreen = $('selectScreen'), gameScreen = $('gameScreen'), levelsEl = $('levels'),
      continueBtn = $('continueBtn'), passedCount = $('passedCount'), selFill = $('selFill'), selBar = $('selBar'),
      sky = $('sky'), wordEl = $('word'), gridEl = $('grid'), scoreEl = $('score'), scoreWrap = $('scoreWrap'),
      barFill = $('barfill'), bar = $('bar'), answeredEl = $('answered'), accEl = $('acc'), lvname = $('lvname'),
      overlay = $('overlay');

  /* ---------- level select ---------- */
  var lvEls = [];
  (function buildLevels() {
    for (var g = 0; g < LEVELS / GROUP; g++) {
      var sec = document.createElement('section');
      var h = document.createElement('div');
      h.className = 'grp-h';
      var b = document.createElement('b');
      b.textContent = '第 ' + (g * GROUP + 1) + '–' + ((g + 1) * GROUP) + ' 關';
      var s = document.createElement('span');
      s.textContent = '約第 ' + fmt(g * GROUP * PER + 1) + '–' + fmt((g + 1) * GROUP * PER) + ' 常見字';
      h.appendChild(b); h.appendChild(s);
      var grid = document.createElement('div');
      grid.className = 'lvgrid';
      for (var k = 1; k <= GROUP; k++) {
        (function (n) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'lv';
          btn.textContent = n;
          btn.addEventListener('click', function () { startLevel(n); });
          grid.appendChild(btn);
          lvEls[n] = btn;
        })(g * GROUP + k);
      }
      sec.appendChild(h); sec.appendChild(grid);
      levelsEl.appendChild(sec);
    }
  })();

  function nextUnpassed() {
    for (var n = 1; n <= LEVELS; n++) if (!progress.passed[n]) return n;
    return 0;
  }

  function refreshSelect() {
    var done = 0;
    for (var n = 1; n <= LEVELS; n++) {
      var p = !!progress.passed[n];
      if (p) done++;
      lvEls[n].classList.toggle('pass', p);
      lvEls[n].classList.toggle('last', progress.last === n);
      lvEls[n].setAttribute('aria-label', '第 ' + n + ' 關' + (p ? '，已過關' : ''));
    }
    passedCount.textContent = done;
    selFill.style.width = done + '%';
    selBar.setAttribute('aria-valuenow', String(done));
    var nx = nextUnpassed();
    if (loadFailed) { continueBtn.textContent = '單字載入失敗，請重新整理頁面'; continueBtn.disabled = true; }
    else if (!ALL) { continueBtn.textContent = '單字載入中…'; continueBtn.disabled = true; }
    else {
      continueBtn.disabled = false;
      continueBtn.textContent = nx ? (done ? '繼續：第 ' + nx + ' 關' : '開始：第 1 關') : '全部過關，再玩第 1 關';
    }
  }

  continueBtn.addEventListener('click', function () { startLevel(nextUnpassed() || 1); });

  function scrollToLast() {
    var t = lvEls[progress.last] || lvEls[nextUnpassed() || 1];
    if (t && t.scrollIntoView) { try { t.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }

  /* ---------- game state ---------- */
  var cells = [];
  for (var i = 0; i < 9; i++) {
    (function (idx) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.addEventListener('click', function () { resolve(idx); });
      gridEl.appendChild(b);
      cells.push(b);
    })(i);
  }

  var level = 0, pool = [], board = [], deck = [], retry = [], missed = new Map();
  var cur = -1, lastIdx = -1, score = 0, answered = 0, correct = 0, turn = 0;
  var locked = true, running = false, raf = 0, t0 = 0, advTimer = 0, endTimer = 0, hiddenAt = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function conflicts(w, skip) {
    for (var i = 0; i < board.length; i++) {
      if (i === skip || !board[i]) continue;
      if (board[i].en === w.en || board[i].zh === w.zh) return true;
    }
    return false;
  }

  function draw(skip) {
    var old = skip >= 0 && board[skip] ? board[skip].en : null;
    for (var i = 0; i < retry.length; i++) {
      var r = retry[i];
      if (r.ready <= turn && r.w.en !== old && !conflicts(r.w, skip)) {
        retry.splice(i, 1);
        return r.w;
      }
    }
    for (var t = 0; t < 600; t++) {
      if (!deck.length) deck = shuffle(pool.slice());
      var w = deck.pop();
      if (w.en !== old && !conflicts(w, skip)) return w;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function setCell(i, fresh) {
    cells[i].textContent = board[i].zh;
    if (fresh) {
      cells[i].classList.remove('fresh');
      void cells[i].offsetWidth;
      cells[i].classList.add('fresh');
    }
  }

  function updateHud() {
    scoreEl.textContent = String(score).replace('-', '−');
    var pct = Math.max(0, Math.min(100, score / GOAL * 100));
    barFill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', String(Math.max(0, score)));
    scoreWrap.classList.toggle('low', answered > 0 && score <= 0);
    answeredEl.textContent = '已答 ' + answered + ' 題';
    accEl.textContent = '答對率 ' + (answered ? Math.round(correct / answered * 100) + '%' : '—');
  }

  function stopTimers() {
    clearTimeout(advTimer); clearTimeout(endTimer); cancelAnimationFrame(raf);
  }

  function reset() {
    stopTimers();
    board = []; deck = shuffle(pool.slice()); retry = []; missed = new Map();
    score = 0; answered = 0; correct = 0; turn = 0; lastIdx = -1; cur = -1; locked = true; running = false;
    for (var i = 0; i < 9; i++) board[i] = draw(-1);
    for (var k = 0; k < 9; k++) {
      cells[k].classList.remove('good', 'bad', 'fresh');
      setCell(k, false);
    }
    wordEl.hidden = true;
    updateHud();
  }

  function place(p) {
    var h = sky.clientHeight - wordEl.offsetHeight - 3;
    wordEl.style.transform = 'translate(-50%,' + Math.max(0, p * h) + 'px)';
  }

  function nextWord() {
    var idx;
    do { idx = Math.floor(Math.random() * 9); } while (idx === lastIdx);
    cur = idx;
    wordEl.className = 'word';
    wordEl.textContent = board[cur].en;
    wordEl.hidden = false;
    place(0);
    t0 = performance.now();
    locked = false;
    raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    if (locked) return;
    var p = (now - t0) / DURATION;
    if (p >= 1) { place(1); resolve(-1); return; }
    place(p);
    wordEl.classList.toggle('urgent', p > 0.7);
    raf = requestAnimationFrame(tick);
  }

  function pop(text, good) {
    var s = document.createElement('span');
    s.className = 'pop ' + (good ? 'good' : 'bad');
    s.textContent = text;
    var r = wordEl.getBoundingClientRect(), sr = sky.getBoundingClientRect();
    s.style.left = (r.left - sr.left + r.width / 2) + 'px';
    s.style.top = Math.max(0, r.top - sr.top - 6) + 'px';
    sky.appendChild(s);
    setTimeout(function () { s.remove(); }, 900);
  }

  function resolve(choice) {
    if (locked || !running) return;
    locked = true;
    cancelAnimationFrame(raf);
    var w = board[cur], ok = choice === cur;
    answered++;
    wordEl.classList.remove('urgent');
    if (ok) {
      score++; correct++;
      wordEl.classList.add('hit');
    } else {
      score--;
      wordEl.classList.add('miss');
      missed.set(w.en, w);
      retry.push({ w: w, ready: turn + RETRY_GAP });
      if (choice >= 0) cells[choice].classList.add('bad');
    }
    cells[cur].classList.add('good');
    pop(ok ? '+1' : '−1', ok);
    updateHud();
    if (score >= GOAL) { running = false; endTimer = setTimeout(function () { finish(true); }, 900); return; }
    if (score < 0) { running = false; endTimer = setTimeout(function () { finish(false); }, 1200); return; }
    advTimer = setTimeout(advance, ok ? 450 : 1100);
  }

  function advance() {
    cells.forEach(function (c) { c.classList.remove('good', 'bad'); });
    wordEl.hidden = true;
    board[cur] = draw(cur);
    setCell(cur, true);
    lastIdx = cur;
    turn++;
    nextWord();
  }

  /* ---------- overlay ---------- */
  function showOverlay(o) {
    $('ov-eyebrow').textContent = o.eyebrow || '';
    $('ov-title').textContent = o.title;
    var big = $('ov-big'); big.hidden = !o.big; big.textContent = o.big || '';
    var st = $('ov-stats'); st.hidden = !o.stats; st.textContent = o.stats || '';
    var list = $('ov-list'); list.textContent = '';
    var items = o.missed || [];
    items.forEach(function (w) {
      var li = document.createElement('li');
      var b = document.createElement('b'); b.textContent = w.en;
      var s = document.createElement('span'); s.textContent = w.zh;
      li.appendChild(b); li.appendChild(s);
      list.appendChild(li);
    });
    $('ov-missed').hidden = items.length === 0;
    var act = $('ov-actions'); act.textContent = '';
    o.actions.forEach(function (a, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = i === 0 ? 'go' : 'ghost';
      b.textContent = a.label;
      b.addEventListener('click', a.fn);
      act.appendChild(b);
    });
    overlay.hidden = false;
    var first = act.firstChild; if (first) first.focus();
  }

  function levelRange(n) { return '約第 ' + fmt((n - 1) * PER + 1) + '–' + fmt(n * PER) + ' 常見字'; }

  function finish(win) {
    var rate = Math.round(correct / Math.max(1, answered) * 100);
    if (win) {
      progress.passed[level] = { acc: rate, at: Date.now() };
      progress.last = level;
      save();
    }
    var acts = [];
    if (win) {
      if (level < LEVELS) acts.push({ label: '下一關', fn: function () { startLevel(level + 1); } });
      acts.push({ label: '再玩一次', fn: function () { startLevel(level); } });
    } else {
      acts.push({ label: '再試一次', fn: function () { startLevel(level); } });
    }
    acts.push({ label: '回到選關', fn: leaveGame });
    showOverlay({
      eyebrow: '第 ' + level + ' 關',
      title: win ? '過關' : '挑戰失敗',
      big: String(score).replace('-', '−') + ' 分',
      stats: (win ? '達成 100 分。' : '分數低於 0。') + '共答 ' + answered + ' 題，答對 ' + correct + ' 題（' + rate + '%）',
      missed: Array.from(missed.values()),
      actions: acts
    });
  }

  /* ---------- flow ---------- */
  function startLevel(n) {
    if (!ALL) return;
    level = n;
    progress.last = n;
    save();
    pool = ALL.slice((n - 1) * PER, n * PER).map(function (p) { return { en: p[0], zh: p[1] }; });
    selectScreen.hidden = true;
    gameScreen.hidden = false;
    lvname.textContent = '';
    var b = document.createElement('b'); b.textContent = '第 ' + n + ' 關';
    lvname.appendChild(b);
    lvname.appendChild(document.createTextNode(levelRange(n)));
    reset();
    showOverlay({
      eyebrow: levelRange(n),
      title: '第 ' + n + ' 關',
      stats: '10 秒內點出正確的中文。答對 +1，答錯或超時 −1，累積 100 分過關，低於 0 分失敗。' + (progress.passed[n] ? '這一關你已經過關了。' : ''),
      actions: [
        { label: '開始', fn: begin },
        { label: '回到選關', fn: leaveGame }
      ]
    });
  }

  function begin() {
    overlay.hidden = true;
    running = true;
    nextWord();
  }

  function leaveGame() {
    stopTimers();
    running = false; locked = true;
    overlay.hidden = true;
    gameScreen.hidden = true;
    selectScreen.hidden = false;
    refreshSelect();
    scrollToLast();
  }

  $('back').addEventListener('click', leaveGame);

  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '9' && !gameScreen.hidden) resolve(parseInt(e.key, 10) - 1);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = performance.now(); }
    else if (hiddenAt) { if (!locked) t0 += performance.now() - hiddenAt; hiddenAt = 0; }
  });

  refreshSelect();
  scrollToLast();
})();
</script>
